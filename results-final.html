<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表决实时统计</title><script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script><style>body{margin:0;background:#f6f7f9;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 14px 70px}.card{background:#fff;border-radius:14px;margin:14px 0;padding:16px}.title{font-size:27px;font-weight:800}.sub{color:#667085;margin-top:7px}.field{width:100%;box-sizing:border-box;padding:12px;border:1px solid #eaecf0;border-radius:10px;margin-top:12px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#1677ff;color:#fff;font-weight:800;margin-top:10px}.hidden{display:none}.error{margin-top:10px;background:#fff1f0;color:#a8071a;padding:10px;border-radius:8px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px;background:#fff;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:800}.label{font-size:13px;color:#667085}.group-title{font-size:18px;font-weight:800}.row{display:grid;grid-template-columns:minmax(200px,1.6fr) 90px 90px 80px;gap:8px;padding:11px 0;border-bottom:1px solid #f2f4f7}.unit{font-size:12px;color:#667085;margin-top:4px}.yes{color:#168a45;font-weight:700}.no{color:#cf1322;font-weight:700}.alt{background:#fffdf8;padding:10px;margin-top:12px}.voter{display:grid;grid-template-columns:50px 100px 1fr 80px 160px;gap:8px;padding:9px 0;border-bottom:1px solid #f2f4f7;font-size:13px}@media(max-width:650px){.row{grid-template-columns:1fr 70px 70px 65px}.voter{grid-template-columns:40px 80px 1fr 65px}.time{display:none}}</style></head><body><div class="wrap"><div id="login" class="card" style="max-width:520px;margin:80px auto"><div class="title">表决实时统计</div><div class="sub">请输入管理员口令</div><input id="key" type="password" class="field" placeholder="管理口令"><button id="go" class="btn">进入实时统计</button><div id="err" class="error hidden"></div></div><div id="dash" class="hidden"><div class="title">表决实时统计</div><div class="sub">每 10 秒自动刷新</div><div class="stats"><div class="stat"><div id="total" class="num">0</div><div class="label">有效投票</div></div><div class="stat"><div id="refresh" class="num" style="font-size:18px">--</div><div class="label">最近刷新</div></div></div><div id="groups"></div><div class="card"><div class="group-title">已投票人员</div><div id="voters"></div></div><div id="dasherr" class="error hidden"></div></div></div><script>const app=cloudbase.init({env:'changhai-d3g5wjyhka349046a',region:'ap-shanghai'});const auth=app.auth();let adminKey='';async function ensureAuth(){try{const s=await auth.getLoginState();if(s)return true}catch(e){}try{await auth.anonymousAuthProvider().signIn();return true}catch(e){return false}}function show(id,m){const x=document.getElementById(id);x.textContent=m;x.classList.remove('hidden')}async function load(){document.getElementById('dasherr').classList.add('hidden');try{await ensureAuth();const res=await app.callFunction({name:'getResults',data:{adminKey},parse:true});let out=res&&res.result;if(typeof out==='string'){try{out=JSON.parse(out)}catch(e){}}if(!out||!out.ok)throw new Error((out&&out.message)||'读取失败');document.getElementById('total').textContent=out.totalVotes;document.getElementById('refresh').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});document.getElementById('groups').innerHTML=out.groups.map((g,i)=>'<div class="card"><div class="group-title">'+(i+1)+'. '+g.name+'</div>'+g.candidates.map(c=>'<div class="row"><div><b>'+c.role+' · '+c.name+'</b><div class="unit">'+c.unit+'</div></div><div class="yes">同意 '+c.agree+'</div><div class="no">不同意 '+c.disagree+'</div><div><b>'+c.agreeRate+'%</b></div></div>').join('')+'<div class="alt"><b>拟推荐人选</b><br>'+(g.alternatives.length?g.alternatives.map(a=>a.name+'｜'+a.unit+'｜'+a.count+'票').join('<br>'):'暂无')+'</div></div>').join('');document.getElementById('voters').innerHTML=out.voters.map(v=>'<div class="voter"><div>'+v.index+'</div><div>'+v.name+'</div><div>'+v.unit+'</div><div>'+v.disagreeCount+'</div><div class="time">'+(v.clientTime||'')+'</div></div>').join('');return true}catch(e){show(document.getElementById('dash').classList.contains('hidden')?'err':'dasherr',e.message||'读取失败');return false}}document.getElementById('go').onclick=async()=>{adminKey=document.getElementById('key').value.trim();if(!adminKey)return show('err','请输入管理口令');if(await load()){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');setInterval(load,10000)}};</script></body></html>
