<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>新增协作组组长、副组长表决</title><script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script><style>body{margin:0;background:#f6f7f9;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 14px 110px}.title{font-size:25px;font-weight:800}.sub{color:#667085;line-height:1.65;font-size:14px;margin-top:8px}.deadline{margin-top:12px;padding:10px 12px;background:#fff7e6;border-radius:10px;color:#ad6800}.card{background:#fff;border-radius:14px;margin:14px 0;overflow:hidden;box-shadow:0 2px 12px rgba(16,24,40,.05)}.pad{padding:16px}.field{width:100%;box-sizing:border-box;padding:12px;margin-top:9px;border:1px solid #eaecf0;border-radius:10px;background:#f9fafb;font-size:15px}.actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:13px;font-weight:700}.all{flex:1;background:#1677ff;color:#fff}.reset{background:#eef2f6}.group{padding:15px 16px;background:#f8fafc;font-weight:800}.candidate{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid #f2f4f7;align-items:center}.name{font-weight:750}.unit{font-size:12px;color:#667085;margin-top:5px}.votes{display:flex;gap:6px}.vote{border:1px solid #e5e7eb;background:#f8fafc;color:#667085;border-radius:8px;padding:8px 11px}.vote.agree.active{background:#eaf7ef;color:#168a45;border-color:#b7ebc6;font-weight:750}.vote.disagree.active{background:#fff1f0;color:#cf1322;border-color:#ffccc7;font-weight:750}.alt{padding:15px 16px;background:#fffdf8}.submitbar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 14px}.submit{display:block;width:min(720px,100%);margin:auto;border:0;border-radius:11px;padding:14px;background:#1677ff;color:#fff;font-size:17px;font-weight:800}.error{background:#fff1f0;color:#a8071a;padding:11px;border-radius:9px;margin-top:12px}.hidden{display:none!important}@media(max-width:520px){.candidate{align-items:flex-start;flex-direction:column}.votes{width:100%}.vote{flex:1}}</style></head><body><div class="wrap" id="main"><div class="title">新增协作组组长、副组长表决</div><div class="sub">中华医学会消化内镜学分会第九届专科委员会。点击“全部同意”可一键选择，之后仍可逐人修改。</div><div class="deadline">截止：2026年8月15日 23:59:59（北京时间）</div><div class="card pad"><b>投票人信息</b><input id="voterName" class="field" placeholder="姓名（必填）"><input id="voterUnit" class="field" placeholder="单位（必填）"></div><div class="card pad"><div class="actions"><button id="allAgree" class="btn all">✓ 全部同意</button><button id="reset" class="btn reset">重新选择</button></div></div><div id="groups"></div><div id="error" class="error hidden"></div></div><div id="success" class="wrap hidden"><div class="card pad" style="text-align:center"><div style="font-size:46px;color:#168a45">✓</div><h2>表决已提交</h2><div style="color:#667085">投票结果已写入腾讯云数据库。</div></div></div><div class="submitbar"><button id="submit" class="submit">提交表决</button></div><script>const ENV_ID='changhai-d3g5wjyhka349046a';const DEADLINE=new Date('2026-08-15T23:59:59+08:00');const app=cloudbase.init({env:ENV_ID,region:'ap-shanghai'});const auth=app.auth();const groups=[{id:'ibd',name:'IBD内镜诊治协作组',candidates:[['组长','刘小伟','中南大学湘雅二医院'],['副组长','缪应雷','昆明医科大学第一附属医院'],['副组长','杨红','北京协和医院'],['副组长','毛仁','中山大学附属第一医院'],['副组长','施海韵','北京友谊医院'],['副组长','柏愚','上海长海医院'],['副组长','徐桂芳','安徽医科大学第一附属医院']]},{id:'surgery',name:'内镜外科青年协作组',candidates:[['组长','张磊','兰州大学第一医院'],['副组长','王琦','宁夏医科大学总医院'],['副组长','杨富春','浙江大学附属第一医院'],['副组长','蔡开琳','华中科技大学同济医学院附属协和医院'],['副组长','刘威','中南大学湘雅二医院'],['副组长','陈震','天津市南开医院'],['副组长','张桂信','大连医科大学附属第二医院']]},{id:'colon',name:'大肠镜青年协作组',candidates:[['组长','刘思德','南方医科大学南方医院'],['副组长','王强','北京协和医院'],['副组长','何梦江','复旦大学附属中山医院'],['副组长','赵九龙','海军军医大学附属长海医院'],['副组长','冯哲','四川大学附属华西医院'],['副组长','王健','辽宁方大总医院'],['副组长','赖秋华','南方医科大学附属南方医院']]}];const state={};const key=(g,c)=>g+'_'+c;function render(){let h='';groups.forEach((g,gi)=>{h+='<div class="card"><div class="group">'+(gi+1)+'. '+g.name+'</div>';g.candidates.forEach((c,ci)=>{const v=state[key(gi,ci)]||'';h+='<div class="candidate"><div><div class="name">'+c[0]+' · '+c[1]+'</div><div class="unit">'+c[2]+'</div></div><div class="votes"><button class="vote agree '+(v==='同意'?'active':'')+'" data-g="'+gi+'" data-c="'+ci+'" data-v="同意">同意</button><button class="vote disagree '+(v==='不同意'?'active':'')+'" data-g="'+gi+'" data-c="'+ci+'" data-v="不同意">不同意</button></div></div>'});h+='<div class="alt"><b>不同意时，可填写拟推荐人选</b><input class="field alt-name" data-g="'+gi+'" placeholder="拟推荐人选姓名"><input class="field alt-unit" data-g="'+gi+'" placeholder="拟推荐人选单位"></div></div>'});document.getElementById('groups').innerHTML=h;document.querySelectorAll('.vote').forEach(b=>b.onclick=()=>{const vals=[...document.querySelectorAll('.alt-name')].map(x=>x.value),units=[...document.querySelectorAll('.alt-unit')].map(x=>x.value);state[key(+b.dataset.g,+b.dataset.c)]=b.dataset.v;render();document.querySelectorAll('.alt-name').forEach((x,i)=>x.value=vals[i]||'');document.querySelectorAll('.alt-unit').forEach((x,i)=>x.value=units[i]||'')})}render();document.getElementById('allAgree').onclick=()=>{groups.forEach((g,gi)=>g.candidates.forEach((c,ci)=>state[key(gi,ci)]='同意'));render()};document.getElementById('reset').onclick=()=>{Object.keys(state).forEach(k=>delete state[k]);render()};function err(m){const e=document.getElementById('error');e.textContent=m;e.classList.remove('hidden')}async function ensureAuth(){try{const s=await auth.getLoginState();if(s)return true}catch(e){}try{await auth.anonymousAuthProvider().signIn();return true}catch(e){return false}}document.getElementById('submit').onclick=async()=>{document.getElementById('error').classList.add('hidden');if(new Date()>DEADLINE)return err('投票已截止');const name=document.getElementById('voterName').value.trim(),unit=document.getElementById('voterUnit').value.trim();if(!name||!unit)return err('请填写姓名和单位');for(let gi=0;gi<groups.length;gi++)for(let ci=0;ci<groups[gi].candidates.length;ci++)if(!state[key(gi,ci)])return err('请完成所有候选人的表决');const payload={voterName:name,voterUnit:unit,clientTime:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' 北京时间',groups:groups.map((g,gi)=>({id:g.id,candidates:g.candidates.map((c,ci)=>({vote:state[key(gi,ci)]})),alternativeName:document.querySelector('.alt-name[data-g="'+gi+'"]').value.trim(),alternativeUnit:document.querySelector('.alt-unit[data-g="'+gi+'"]').value.trim()}))};const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='正在提交…';try{await ensureAuth();const res=await app.callFunction({name:'submitVote',data:payload,parse:true});let out=res&&res.result;if(typeof out==='string'){try{out=JSON.parse(out)}catch(e){}}if(!out||!out.ok)throw new Error((out&&out.message)||'提交失败');document.getElementById('main').classList.add('hidden');document.getElementById('success').classList.remove('hidden');document.querySelector('.submitbar').classList.add('hidden')}catch(e){err(e.message||'提交失败');btn.disabled=false;btn.textContent='提交表决'}};</script></body></html>
